# Enable mouse support and extended keys in tmux
set -g mouse on

# Enable extended key support for terminal (required for Alt+Shift+Arrow keys)
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Swap/move pane up/down (previous/next pane) with Alt+Shift+Up/Down
bind -n M-S-Up swap-pane -U
bind -n M-S-Down swap-pane -D

# switch panes with Alt+Arrow (no prefix)
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R

# switch windows with Ctrl(+Shift)+Tab
bind -n C-Tab select-window -n
bind -n C-S-Tab select-window -p

